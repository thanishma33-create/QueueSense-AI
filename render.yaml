services:
  - type: web
    name: queuesense-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./queuesense.db
      - key: FRONTEND_URL
        value: https://queuesense-ai-1.onrender.com
      - key: LOG_LEVEL
        value: INFO

  - type: static
    name: queuesense-ai-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://queuesense-ai-rx39.onrender.com
      - key: VITE_WS_BASE_URL
        value: wss://queuesense-ai-rx39.onrender.com/ws
      - key: VITE_DEMO_MODE
        value: "false"
